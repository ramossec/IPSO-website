name: Deploy site IPSO no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build (base = nome do repositório)
        run: npm run build
        env:
          BASE_URL_OVERRIDE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # enablement: true só funciona com um PAT/App token (Settings > Actions secrets > PAGES_PAT).
        # Sem o secret, usa GITHUB_TOKEN e o Pages precisa ser habilitado uma vez em Settings > Pages > Source: GitHub Actions.
        with:
          enablement: ${{ secrets.PAGES_PAT != '' }}
          token: ${{ secrets.PAGES_PAT || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ao GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5